{% extends 'base.html' %}
{% block title %}Deposit Successful - CBI Bank{% endblock %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6 col-lg-5">
        <div class="result-box">
            <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
            <h4 class="mb-3">Deposit Successful!</h4>
            <p class="text-muted">Account No: <strong>{{ accno }}</strong></p>
            <div class="row mt-4">
                <div class="col-6">
                    <p class="text-muted small mb-1">Previous Balance</p>
                    <h5>₹ {{ balance }}</h5>
                </div>
                <div class="col-6">
                    <p class="text-muted small mb-1">Deposited</p>
                    <h5 class="text-success">+ ₹ {{ deposit }}</h5>
                </div>
            </div>
            <hr>
            <p class="text-muted small mb-1">New Balance</p>
            <div class="result-amount">₹ {{ newbalance }}</div>
            <a href="{% url 'depv' %}" class="btn btn-cbi mt-3"><i class="fas fa-plus me-2"></i>Another Deposit</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Account Closed - CBI Bank{% endblock %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6 col-lg-5">
        <div class="result-box danger">
            <i class="fas fa-user-slash fa-3x text-danger mb-3"></i>
            <h4 class="mb-3">Account Deactivated</h4>
            <p class="text-muted">Account Holder: <strong>{{ name }}</strong></p>
            <p class="text-muted">Account No: <strong>{{ accno }}</strong></p>
            <p class="mt-3">Your account has been successfully deactivated. Thank you for banking with us.</p>
            <a href="{% url 'homev' %}" class="btn btn-cbi mt-3"><i class="fas fa-home me-2"></i>Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}

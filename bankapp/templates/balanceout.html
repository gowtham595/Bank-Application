{% extends 'base.html' %}
{% block title %}Account Balance - CBI Bank{% endblock %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6 col-lg-5">
        <div class="result-box">
            <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
            <h4 class="mb-2">Balance Enquiry Successful</h4>
            <p class="text-muted mb-3">Account Holder: <strong>{{ name }}</strong></p>
            <p class="text-muted">Account No: <strong>{{ accno }}</strong></p>
            <div class="result-amount mt-3">₹ {{ balance }}</div>
            <p class="text-muted small mt-2">Current Available Balance</p>
            <a href="{% url 'balv' %}" class="btn btn-cbi mt-3"><i class="fas fa-redo me-2"></i>Check Another</a>
        </div>
    </div>
</div>
{% endblock %}

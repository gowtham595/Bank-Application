{% extends 'base.html' %}
{% block title %}Balance Enquiry - CBI Bank{% endblock %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6 col-lg-5">
        <div class="cbi-card">
            <div class="card-header-cbi text-center">
                <h4><i class="fas fa-wallet me-2"></i>Balance Enquiry</h4>
                <p class="mb-0 small opacity-75">Check your account balance securely</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-hashtag me-1 text-primary"></i>Account Number</label>
                        {{ form.accno }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label"><i class="fas fa-lock me-1 text-primary"></i>Password</label>
                        {{ form.password }}
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-cbi btn-lg w-100"><i class="fas fa-search me-2"></i>Check Balance</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
